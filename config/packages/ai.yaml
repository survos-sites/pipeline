ai:
    platform:
        openai:
            api_key: '%env(OPENAI_API_KEY)%'
        mistral:
            api_key: '%env(MISTRAL_API_KEY)%'
        # Free, self-hosted vision/OCR via ai-tools (OpenAI Responses API, no key).
        # Models: tesseract, florence-2, florence-2-fast, auto.
        openresponses:
            ai_tools:
                base_url: '%env(AI_TOOLS_URL)%'
                http_client: 'ai_tools.client'

    agent:
        # Standard vision OCR via gpt-4o
        # Used by: OcrTask
        ocr:
            platform: 'ai.platform.openai'
            model: 'gpt-4o'
            tools: false

        # Vision + OCR for handwriting/historical documents
        # Used by: TranscribeHandwritingTask
        # Note: using OpenAI gpt-4o for reliable base64 image handling;
        #   Mistral vision models reject large base64 payloads with 429 errors
        mistral_vision:
            platform: 'ai.platform.openai'
            model: 'gpt-4o'
            tools: false

        # Classification — cheap model is fine
        classify:
            platform: 'ai.platform.openai'
            model: 'gpt-4o-mini'
            tools: false

        # Visual description — full model needed for exhaustive inventory-level prose
        description:
            platform: 'ai.platform.openai'
            model: 'gpt-5.4'
            tools: false

        # Metadata extraction, NER, title, summarize
        metadata:
            platform: 'ai.platform.openai'
            model: 'gpt-4o-mini'
            tools: false
