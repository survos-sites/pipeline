framework:
    messenger:
        transports:
            sync: 'sync://'
            ai_subject.prepare:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: ai_subject.prepare
            ai_subject.observe:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: ai_subject.observe
            ai_subject.analyze:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: ai_subject.analyze
            ai_subject.review:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: ai_subject.review
            ai_subject.publish:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: ai_subject.publish

when@test:
    framework:
        messenger:
            transports:
                ai_subject.prepare: 'in-memory://'
                ai_subject.observe: 'in-memory://'
                ai_subject.analyze: 'in-memory://'
                ai_subject.review: 'in-memory://'
                ai_subject.publish: 'in-memory://'
